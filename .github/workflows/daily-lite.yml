name: Investor daily lite

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing history/watchlist or sending Slack"
        required: false
        default: false
        type: boolean
      max_research_candidates:
        description: "Max market seed candidates"
        required: false
        default: "5"
        type: string
  schedule:
    # Before the US session, after most Japan daytime work.
    # 20:30 JST Mon-Fri == 11:30 UTC Mon-Fri.
    - cron: "30 11 * * 1-5"

concurrency:
  group: investor-daily-lite
  cancel-in-progress: false

jobs:
  daily-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEFAULT_PORTFOLIO_PATH: data/portfolio_20man.csv
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate live notification config
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "::error::SLACK_WEBHOOK_URL secret is required for live daily-lite runs."
            exit 1
          fi

      - name: Run daily lite
        run: |
          MAX_CANDIDATES="${{ inputs.max_research_candidates }}"
          if [ -z "${MAX_CANDIDATES}" ]; then
            MAX_CANDIDATES="5"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python skills/daily_lite.py --dry-run --max-research-candidates "${MAX_CANDIDATES}"
          else
            python skills/daily_lite.py --max-research-candidates "${MAX_CANDIDATES}"
          fi

      - name: Upload daily lite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-daily-lite-${{ github.run_id }}
          path: |
            reports/daily/
            data/daily_lite_history.json
            data/watchlist.json
          if-no-files-found: ignore
          retention-days: 30
