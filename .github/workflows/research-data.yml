name: Investor research data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Data collection mode"
        required: true
        default: "market"
        type: choice
        options:
          - market
          - watchlist
          - both
      max_tickers:
        description: "Max market tickers for market mode"
        required: false
        default: "15"
        type: string
  schedule:
    # Market research data, twice weekly.
    # 20:30 JST Mon/Thu == 11:30 UTC Mon/Thu.
    - cron: "30 11 * * 1,4"
    # Watchlist deep data, weekly.
    # 10:00 JST Sat == 01:00 UTC Sat.
    - cron: "0 1 * * 6"

concurrency:
  group: investor-research-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEFAULT_PORTFOLIO_PATH: data/portfolio_20man.csv
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Collect data
        run: |
          mkdir -p action_outputs

          MODE="${{ inputs.mode }}"
          MAX_TICKERS="${{ inputs.max_tickers }}"
          if [ -z "${MAX_TICKERS}" ]; then
            MAX_TICKERS="15"
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 1 * * 6" ]; then
              MODE="watchlist"
            else
              MODE="market"
            fi
          fi

          echo "mode=${MODE}" >> "${GITHUB_ENV}"
          echo "max_tickers=${MAX_TICKERS}" >> "${GITHUB_ENV}"

          if [ "${MODE}" = "market" ] || [ "${MODE}" = "both" ]; then
            python skills/research.py --max-tickers "${MAX_TICKERS}" > action_outputs/research_data.json
          fi

          if [ "${MODE}" = "watchlist" ] || [ "${MODE}" = "both" ]; then
            python skills/watchlist_research.py > action_outputs/watchlist_research_data.json
          fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "# Investor research data"
            echo ""
            echo "- Mode: ${mode:-unknown}"
            echo "- Max tickers: ${max_tickers:-unknown}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "## Outputs"
            find action_outputs -type f -maxdepth 1 -print 2>/dev/null | sort | sed 's#^#- #'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Notify Slack if configured
        if: always()
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping Slack notification."
            exit 0
          fi
          python - <<'PY'
          import os
          from investor.notifications.slack import SlackNotifier

          mode = os.environ.get("mode", "unknown")
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          SlackNotifier().send_text(
              f":mag: Investor research data collected\nMode: `{mode}`\nRun: {run_url}\nArtifact: `action_outputs`"
          )
          PY

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-research-data-${{ github.run_id }}
          path: action_outputs/
          if-no-files-found: error
          retention-days: 30
